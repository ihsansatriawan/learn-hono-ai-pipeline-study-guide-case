<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architecture — Study Guide Pipeline API</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Study Guide Pipeline API</p>
    <h1>Raw material enters through the API, a worker does the work, and it lands whole in PostgreSQL</h1>

    <svg viewBox="0 64 1000 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sg-arch-title sg-arch-desc">
      <title id="sg-arch-title">Study Guide Pipeline API architecture</title>
      <desc id="sg-arch-desc">The Hono API stores the request in PostgreSQL and enqueues it in Redis; a separate worker picks that work up, runs a four-step Anvia pipeline against the model provider, then writes the whole study guide back to PostgreSQL in a single transaction.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ARROWS (drawn before boxes) -->

      <!-- a1 Client -> API : POST -->
      <line x1="152" y1="140" x2="248" y2="140" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="172" y="120" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="129" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /jobs</text>

      <!-- a2 Client -> API : GET -->
      <line x1="152" y1="172" x2="248" y2="172" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="166" y="152" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="161" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /jobs/:id</text>

      <!-- a3 API -> Redis : enqueue -->
      <line x1="408" y1="148" x2="504" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="436" y="128" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="456" y="137" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENQUEUE</text>

      <!-- a4 Redis -> Worker : deliver -->
      <line x1="580" y1="184" x2="580" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="588" y="226" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="592" y="235" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DELIVER</text>

      <!-- a5 Worker -> Pipeline : run -->
      <line x1="656" y1="316" x2="752" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="672" y="296" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="704" y="305" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUN 4 STEPS</text>

      <!-- a6 Pipeline -> Model : completions -->
      <line x1="840" y1="280" x2="840" y2="184" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="848" y="226" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="852" y="235" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">3x COMPLETION</text>

      <!-- a7 API -> Postgres : insert pending -->
      <line x1="288" y1="184" x2="288" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="296" y="292" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="300" y="301" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">INSERT PENDING</text>

      <!-- a8 Postgres -> API : read back -->
      <line x1="368" y1="448" x2="368" y2="184" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="376" y="360" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="380" y="369" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SELECT</text>

      <!-- a9 Worker -> Postgres : single transaction (FOCAL) -->
      <line x1="580" y1="352" x2="580" y2="448" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <rect x="588" y="394" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="592" y="403" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">1 TRANSACTION</text>

      <!-- NODES -->

      <!-- Client -->
      <rect x="32" y="112" width="120" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="112" width="120" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="40" y="118" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="54" y="127" fill="rgba(122,131,153,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="92" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client</text>
      <text x="92" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">curl / app</text>

      <!-- Hono API -->
      <rect x="248" y="112" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="112" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="256" y="118" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="270" y="127" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="328" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hono API</text>
      <text x="328" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:3100</text>

      <!-- Redis / BullMQ -->
      <rect x="504" y="112" width="152" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="504" y="112" width="152" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="512" y="118" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="530" y="127" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUEUE</text>
      <text x="580" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redis · BullMQ</text>
      <text x="580" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">{ studyJobId }</text>

      <!-- Model provider -->
      <rect x="752" y="112" width="176" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="752" y="112" width="176" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="760" y="118" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="774" y="127" fill="rgba(45,49,66,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="840" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Model Provider</text>
      <text x="840" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OpenAI-compatible</text>

      <!-- Worker (FOCAL) -->
      <rect x="504" y="280" width="152" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="504" y="280" width="152" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="512" y="286" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="528" y="295" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROC</text>
      <text x="580" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Worker</text>
      <text x="580" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">concurrency 2</text>

      <!-- Anvia pipeline -->
      <rect x="752" y="280" width="176" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="752" y="280" width="176" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="760" y="286" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="776" y="295" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PIPE</text>
      <text x="840" y="318" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Anvia Pipeline</text>
      <text x="840" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4 steps · 3 LLM + 1 TS</text>

      <!-- PostgreSQL -->
      <rect x="248" y="448" width="408" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="448" width="408" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="256" y="454" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="268" y="463" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="452" y="486" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL — source of truth</text>
      <text x="452" y="502" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">StudyJob 1—N Concept 1—N QuizQuestion</text>

      <!-- LEGEND -->
      <line x1="32" y1="568" x2="968" y2="568" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="592" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="136" y="584" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="160" y="593" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FOCAL</text>

      <rect x="304" y="584" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="328" y="593" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">NODE.JS PROCESS</text>

      <rect x="512" y="584" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="536" y="593" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">STORAGE</text>

      <rect x="704" y="584" width="16" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="728" y="593" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">EXTERNAL</text>

      <line x1="872" y1="590" x2="896" y2="590" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="904" y="593" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">HTTP</text>
    </svg>
  </div>
</body>
</html>
