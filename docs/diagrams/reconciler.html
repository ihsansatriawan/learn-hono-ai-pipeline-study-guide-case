<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reconciler — Study Guide Pipeline API</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Reconciler · Study Guide Pipeline API</p>
    <h1>Redis is asked what it holds, and the answer — never the clock — decides the study job's fate</h1>

    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sg-rec-title sg-rec-desc">
      <title id="sg-rec-title">How the reconciler recovers study jobs the queue has lost</title>
      <desc id="sg-rec-desc">Accepting a study job is two unbound writes: PostgreSQL commits the row, then Redis receives a pointer. A process that dies between them leaves a PENDING row with no queue entry. Every sixty seconds the reconciler sweeps PostgreSQL for rows stale beyond two minutes, asks Redis getJobState for each, and acts on the answer: rows the queue still holds are left alone, a PENDING row Redis does not know is re-enqueued, and everything else is closed as FAILED.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-faint" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgba(79,93,117,0.55)"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ══════════ BAND A · how the gap opens ══════════ -->

      <text x="32" y="34" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HOW THE GAP OPENS — TWO WRITES, NOTHING BINDING THEM</text>

      <!-- A1 Hono API -->
      <rect x="32" y="52" width="200" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="132" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hono API</text>
      <text x="132" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /jobs</text>

      <line x1="232" y1="78" x2="272" y2="78" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A2 commit -->
      <rect x="272" y="52" width="220" height="52" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="382" y="76" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">INSERT studyJob PENDING</text>
      <text x="382" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PostgreSQL — committed</text>

      <!-- the break -->
      <line x1="492" y1="78" x2="516" y2="78" stroke="rgba(79,93,117,0.55)" stroke-width="1.2" stroke-dasharray="3,3"/>
      <line x1="514" y1="68" x2="530" y2="88" stroke="#4f5d75" stroke-width="1.6"/>
      <line x1="530" y1="68" x2="514" y2="88" stroke="#4f5d75" stroke-width="1.6"/>
      <line x1="528" y1="78" x2="552" y2="78" stroke="rgba(79,93,117,0.55)" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-faint)"/>
      <text x="522" y="122" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">process dies here · or markFailed itself fails</text>

      <!-- A3 the add that never lands -->
      <rect x="552" y="52" width="220" height="52" rx="6" fill="#f5f5f5" stroke="rgba(79,93,117,0.45)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="662" y="76" fill="rgba(45,49,66,0.60)" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">queue.add({ studyJobId })</text>
      <text x="662" y="92" fill="rgba(79,93,117,0.75)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">never reaches Redis</text>

      <line x1="772" y1="78" x2="812" y2="78" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A4 the orphan -->
      <rect x="812" y="52" width="156" height="52" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="890" y="74" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Orphaned row</text>
      <text x="890" y="90" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PENDING, no reason</text>

      <text x="32" y="150" fill="rgba(79,93,117,0.85)" font-size="9" font-family="'Geist Mono', monospace">BullMQ can never find it — its recovery is driven from Redis, and Redis has no record of this job.</text>

      <line x1="32" y1="172" x2="968" y2="172" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

      <!-- ══════════ BAND B · the sweep ══════════ -->

      <text x="32" y="200" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">THE SWEEP — EVERY 60 SECONDS, INSIDE THE WORKER PROCESS</text>

      <!-- B1 PostgreSQL -->
      <rect x="32" y="218" width="260" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="40" y="224" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="52" y="233" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="162" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL — scanned from here</text>
      <text x="162" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PENDING or PROCESSING, older than 2 min</text>

      <line x1="292" y1="254" x2="392" y2="254" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <rect x="308" y="234" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="342" y="243" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SWEEP · MAX 100</text>

      <!-- B2 Reconciler (FOCAL) -->
      <rect x="392" y="218" width="216" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="400" y="224" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="418" y="233" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SWEEP</text>
      <text x="500" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reconciler</text>
      <text x="500" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">runs in the worker process</text>

      <line x1="608" y1="244" x2="708" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="622" y="224" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="658" y="233" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">getJobState(id)</text>

      <line x1="708" y1="272" x2="608" y2="272" stroke="rgba(79,93,117,0.55)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-faint)"/>
      <rect x="628" y="276" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="658" y="285" fill="rgba(79,93,117,0.85)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ONE WORD</text>

      <!-- B3 Redis -->
      <rect x="708" y="218" width="260" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="716" y="224" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="734" y="233" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUEUE</text>
      <text x="838" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redis · BullMQ</text>
      <text x="838" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ZSCORE completed/failed/delayed · LPOS wait/active</text>

      <!-- ══════════ BAND C · the decision matrix ══════════ -->

      <text x="32" y="336" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WHAT THE ANSWER MEANS — THE ROW'S STATUS PICKS THE ROW, REDIS PICKS THE COLUMN</text>

      <!-- column headers -->
      <text x="348" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">active · waiting · delayed · prioritized</text>
      <text x="580" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">unknown</text>
      <text x="832" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">completed · failed</text>

      <!-- row: PENDING -->
      <rect x="32" y="380" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="124" y="408" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">PENDING</text>
      <text x="124" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">nobody has started it</text>

      <rect x="232" y="380" width="232" height="64" rx="6" fill="#f5f5f5" stroke="rgba(79,93,117,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="348" y="408" fill="rgba(45,49,66,0.65)" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LEAVE ALONE</text>
      <text x="348" y="424" fill="rgba(79,93,117,0.75)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">genuinely in flight</text>

      <rect x="480" y="380" width="200" height="64" rx="6" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="580" y="408" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RE-ENQUEUE</text>
      <text x="580" y="424" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">queue.add → back in wait</text>

      <rect x="696" y="380" width="272" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="832" y="408" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CLOSE</text>
      <text x="832" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">markFailed — the queue is done, no guide exists</text>

      <!-- row: PROCESSING -->
      <rect x="32" y="460" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="124" y="488" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">PROCESSING</text>
      <text x="124" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">a worker claimed it</text>

      <rect x="232" y="460" width="232" height="64" rx="6" fill="#f5f5f5" stroke="rgba(79,93,117,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="348" y="488" fill="rgba(45,49,66,0.65)" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LEAVE ALONE</text>
      <text x="348" y="504" fill="rgba(79,93,117,0.75)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">the worker is still on it</text>

      <rect x="480" y="460" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="580" y="488" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CLOSE</text>
      <text x="580" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">markFailed — claimed, then vanished</text>

      <rect x="696" y="460" width="272" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="832" y="488" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CLOSE</text>
      <text x="832" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">markFailed — the queue is done, no guide exists</text>

      <!-- ══════════ BAND D · the two facts that shaped it ══════════ -->

      <rect x="32" y="556" width="452" height="72" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <rect x="32" y="556" width="3" height="72" rx="1.5" fill="#eb6c36"/>
      <text x="52" y="578" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Why ask at all — a blind re-add is a silent no-op</text>
      <text x="52" y="596" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">queue.add dedupes on the EXISTENCE of the job hash, not on the</text>
      <text x="52" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">job still being in flight. A job left in completed/failed swallows</text>
      <text x="52" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">the add and returns the old one. Measured: waiting count stays 0.</text>

      <rect x="516" y="556" width="452" height="72" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
      <rect x="516" y="556" width="3" height="72" rx="1.5" fill="#eb6c36"/>
      <text x="536" y="578" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif">Why age decides nothing — it only sets when to ask</text>
      <text x="536" y="596" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Ordinary jobs here have run 243s end to end, so any threshold small</text>
      <text x="536" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">enough to be useful would condemn a job that is still running. A row</text>
      <text x="536" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">nobody has started is re-enqueued however old it is.</text>

      <!-- ══════════ LEGEND ══════════ -->

      <line x1="32" y1="652" x2="968" y2="652" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="136" y="668" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="160" y="677" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FOCAL</text>

      <rect x="264" y="668" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="288" y="677" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ACTION TAKEN</text>

      <rect x="432" y="668" width="16" height="12" rx="2" fill="#f5f5f5" stroke="rgba(79,93,117,0.35)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="456" y="677" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">NOTHING DONE</text>

      <rect x="608" y="668" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="632" y="677" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">STORAGE</text>

      <line x1="736" y1="674" x2="760" y2="674" stroke="#eb6c36" stroke-width="1.6"/>
      <text x="768" y="677" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">RECOVERY PATH</text>
    </svg>
  </div>
</body>
</html>
