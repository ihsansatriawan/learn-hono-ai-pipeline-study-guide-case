services:
  db:
    image: postgres:16
    container_name: studyguide-postgres
    environment:
      POSTGRES_USER: studyguide
      POSTGRES_PASSWORD: studyguide
      POSTGRES_DB: studyguide
    ports:
      - "55434:5432"
    volumes:
      - studyguide_db:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: studyguide-redis
    ports:
      - "6382:6379"
    volumes:
      - studyguide_redis:/data

volumes:
  studyguide_db:
  studyguide_redis:
